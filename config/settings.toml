[app]
host = "127.0.0.1"
port = 8000
timezone = "UTC"

[collection]
enabled = true
history_months = 12
refresh_seconds = 3600
request_timeout_seconds = 90
request_attempts = 3
stale_after_hours = 48

[comparison]
minimum_hourly_coverage = 0.75
minimum_period_coverage = 0.90
default_pollutant = "PM10"
default_view = "cities"
default_objective = "average"
default_target = "locations"
current_max_age_hours = 6
baseline_minimum_days = 30

[monitoring]
enabled = true
port = 9090
retention_days = 7

[retention]
active_months = 36

[sources]
default = "eea"

[openaq]
enabled = true
include_community = true
requests_per_minute = 45
requests_per_cycle = 1900
revision_days = 7

[alerts]
enabled = true

[bg_direct]
enabled = true
export_interval_seconds = 180
exports_per_cycle = 32
revision_days = 7
