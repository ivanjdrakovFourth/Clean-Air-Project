groups:
  - name: clean-air-finder
    rules:
      - alert: CleanAirApplicationDown
        expr: up{job="clean-air-finder"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Clean Air Finder is not responding."
      - alert: CleanAirCollectionFailed
        expr: clean_air_collection_healthy == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Collection failed. Stored history remains searchable; inspect var/logs."
      - alert: CleanAirWorkerStopped
        expr: clean_air_source_enabled == 1 and clean_air_source_worker_alive == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Automatic collection is enabled but its worker has stopped."
      - alert: CleanAirSourceDataStale
        expr: clean_air_source_age_seconds > clean_air_stale_after_seconds
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "The latest stored source measurement is stale."
      - alert: CleanAirProviderCollectionNeedsAttention
        expr: clean_air_source_collection_healthy == 0 and clean_air_source_enabled == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "A configured source has a failed, partial or missing collection. Inspect in-app Monitoring."
      - alert: CleanAirProviderDataStale
        expr: clean_air_source_data_age_seconds > on(job, instance) group_left clean_air_stale_after_seconds and clean_air_source_cache_ready == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "A source-specific measurement cache is stale. Other sources are not substituted."
